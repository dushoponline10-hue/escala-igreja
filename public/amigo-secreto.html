<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Secreto da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#B3122E; --red-dark:#8A0D23; --green:#1F6B4A; --gold:#E8B04B;
    --cream:#FFF8F0; --ink:#2A1A1A; --muted:#7A6A66; --line:#EADBD0; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream);
    background-image:radial-gradient(circle at 10% 0%,#FBE3E3 0,transparent 40%),radial-gradient(circle at 90% 100%,#E3F1EA 0,transparent 40%);
    min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
  h1,h2,.big{font-family:Fredoka,sans-serif}
  header{text-align:center;margin-bottom:22px}
  header .emoji{font-size:44px}
  header h1{margin:6px 0 4px;font-size:30px;color:var(--red)}
  header p{margin:0;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 2px 0 rgba(0,0,0,.03)}
  .card h2{margin:0 0 12px;font-size:19px;color:var(--green)}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 6px}
  input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#FFFCF9;color:var(--ink)}
  input:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{background:#FDEDEE;color:var(--red-dark);border-radius:999px;padding:6px 8px 6px 12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
  .chip button{border:0;background:rgba(0,0,0,.08);color:inherit;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:600 15px Inter,sans-serif;cursor:pointer;text-decoration:none}
  .btn-primary{background:var(--red);color:#fff;width:100%;padding:15px;font-size:17px}
  .btn-primary:hover{background:var(--red-dark)}
  .btn-soft{background:#F3ECE6;color:var(--ink)}
  .btn-wa{background:#25D366;color:#fff}
  .btn-sm{padding:9px 12px;font-size:14px}
  .hint{font-size:13px;color:var(--muted);margin:8px 0 0}
  .rule{display:flex;align-items:center;justify-content:space-between;background:#F7F1EC;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
  .rule button{border:0;background:none;color:var(--red);cursor:pointer;font-weight:600}
  .person{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .person:last-child{border-bottom:0}
  .person .nm{font-weight:600}
  .person .acts{display:flex;gap:6px}
  .ok{background:#E3F1EA;color:var(--green);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
  .err{background:#FDEDEE;color:var(--red-dark);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;display:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;transition:.25s;opacity:0}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:#FFFCF9;width:100%}

  /* Revelação */
  .reveal{text-align:center;padding-top:30px}
  .reveal .hello{font-size:26px;margin:0 0 6px}
  .gift{width:190px;height:190px;margin:26px auto;position:relative;cursor:pointer;transition:transform .2s}
  .gift:active{transform:scale(.96)}
  .gift .box{position:absolute;bottom:0;left:15px;width:160px;height:120px;background:var(--red);border-radius:12px}
  .gift .lid{position:absolute;top:40px;left:5px;width:180px;height:40px;background:var(--red-dark);border-radius:10px;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
  .gift .rib-v{position:absolute;bottom:0;left:83px;width:24px;height:150px;background:var(--gold)}
  .gift .bow{position:absolute;top:10px;left:65px;font-size:46px;transition:transform .6s}
  .gift.open .lid{transform:translateY(-70px) rotate(-18deg)}
  .gift.open .bow{transform:translateY(-70px) rotate(-18deg)}
  .gift:not(.open){animation:wiggle 2.2s infinite}
  @keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
  .result{display:none}
  .result.show{display:block;animation:pop .5s ease}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .result .big{font-size:44px;color:var(--red);margin:6px 0 16px}
  .info{display:inline-flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:15px}
  .secret{font-size:13px;color:var(--muted);margin-top:20px}
  .confetti{position:fixed;top:-10px;width:9px;height:14px;opacity:.9;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// Link público do artefato (os links individuais são montados a partir dele)
const BASE_URL = "";
const KEY = "AmigoSecretoFamilia2026";
const STORE = "amigo-secreto-v1";

const defaults = {
  names: ["Eduardo","Lucas","Isa","Rodrigo","Rosane","Nicolle","Cecília"],
  value: "R$ 150,00",
  date: "",
  place: "",
  rules: [],
  draw: null
};

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(!s)return {...defaults};
  const st={...defaults,...s};
  // garante nomes novos adicionados ao modelo (ex.: Cecília) em quem já tinha a lista salva
  if(!st.addedCecilia){st.addedCecilia=true;if(!st.names.some(n=>n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")==="cecilia")){st.names.push("Cecília");st.draw=null}}
  return st}catch(e){return {...defaults}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}

// Codifica o resultado de cada pessoa em letras e números (cabe no #do link)
function encode(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  let hex="";bytes.forEach((b,i)=>{hex+=(b^KEY.charCodeAt(i%KEY.length)).toString(16).padStart(2,"0")});
  return "s"+hex;
}
function decode(tok){
  try{
    if(!/^s[0-9a-f]+$/.test(tok))return null;
    const hex=tok.slice(1),arr=new Uint8Array(hex.length/2);
    for(let i=0;i<arr.length;i++)arr[i]=parseInt(hex.substr(i*2,2),16)^KEY.charCodeAt(i%KEY.length);
    return JSON.parse(new TextDecoder().decode(arr));
  }catch(e){return null}
}
function baseLink(){
  if(BASE_URL && !BASE_URL.startsWith("__")) return BASE_URL.split("#")[0];
  return location.href.split("#")[0];
}

// ---------- sorteio ----------
function blocked(a,b){return state.rules.some(r=>(r[0]===a&&r[1]===b)||(r[0]===b&&r[1]===a))}
function doDraw(){
  const n=state.names;
  for(let t=0;t<5000;t++){
    const p=[...n].sort(()=>Math.random()-.5);
    // ciclo único: cada um tira o próximo da roda
    let ok=true;const pairs={};
    for(let i=0;i<p.length;i++){const g=p[i],r=p[(i+1)%p.length];if(blocked(g,r)){ok=false;break}pairs[g]=r}
    if(ok)return pairs;
  }
  return null;
}

// ---------- tela do organizador ----------
let state=load();

function renderAdmin(){
  const drawn=state.draw;
  $("#app").innerHTML=`
    <header><div class="emoji">🎁</div><h1>Amigo Secreto da Família</h1><p>Monte o sorteio e envie um link para cada pessoa</p></header>

    <div class="card">
      <h2>1. Participantes (${state.names.length})</h2>
      <div class="row"><input id="newName" placeholder="Adicionar nome" maxlength="30"><button class="btn btn-soft" id="addBtn" style="flex:0 0 auto">Adicionar</button></div>
      <div class="chips">${state.names.map((n,i)=>`<span class="chip">${esc(n)}<button data-del="${i}" aria-label="Remover ${esc(n)}">✕</button></span>`).join("")}</div>
    </div>

    <div class="card">
      <h2>2. Detalhes</h2>
      <div class="row">
        <div><label for="val">Valor do presente</label><input id="val" value="${esc(state.value)}"></div>
        <div><label for="dt">Data da troca</label><input id="dt" value="${esc(state.date)}" placeholder="Ex.: 24/12 às 20h"></div>
      </div>
      <label for="pl">Local ou recado (opcional)</label><input id="pl" value="${esc(state.place)}" placeholder="Ex.: Casa da vó Rosane · levar um prato" maxlength="80">
      <p class="hint">Valor, data e recado aparecem para cada pessoa na hora da revelação.</p>
    </div>

    <div class="card">
      <h2>3. Quem não pode se tirar (opcional)</h2>
      <div class="row">
        <select id="ra"><option value="">Pessoa</option>${state.names.map(n=>`<option>${esc(n)}</option>`).join("")}</select>
        <select id="rb"><option value="">Pessoa</option>${state.names.map(n=>`<option>${esc(n)}</option>`).join("")}</select>
        <button class="btn btn-soft" id="ruleBtn" style="flex:0 0 auto">+</button>
      </div>
      ${state.rules.map((r,i)=>`<div class="rule"><span>${esc(r[0])} ✕ ${esc(r[1])}</span><button data-rule="${i}">remover</button></div>`).join("")}
      <p class="hint">Útil para casais ou irmãos que moram juntos.</p>
    </div>

    <button class="btn btn-primary" id="drawBtn">${drawn?"🔄 Refazer sorteio":"🎲 Fazer sorteio"}</button>
    <div class="err" id="confirmBox" style="background:#FFF4DC;color:#6B4A00">
      Refazer o sorteio cancela os links já enviados. Tem certeza?
      <div class="row" style="margin-top:10px"><button class="btn btn-soft btn-sm" id="noRedo">Cancelar</button><button class="btn btn-sm" style="background:var(--red);color:#fff" id="yesRedo">Sim, refazer</button></div>
    </div>
    <div class="err" id="err"></div>

    ${drawn?`
    <div class="card" style="margin-top:16px">
      <h2>4. Links de cada pessoa</h2>
      <div class="ok">✅ Sorteio feito! Ninguém aparece aqui: cada link mostra só o amigo daquela pessoa.</div>
      ${state.names.filter(n=>drawn[n]).map(n=>{
        const link=baseLink()+"#"+encode({g:n,r:drawn[n],v:state.value,d:state.date,p:state.place});
        const msg=`Oi, ${n}! 🎁 Chegou a hora do nosso Amigo Secreto da Família. Abra o seu link e descubra quem você tirou (é só seu, não mostre pra ninguém!):\n${link}`;
        return `<div class="person"><span class="nm">${esc(n)}</span><span class="acts">
          <button class="btn btn-soft btn-sm" data-copy="${esc(msg)}">Copiar</button>
          <a class="btn btn-wa btn-sm" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a></span></div>`}).join("")}
      <p class="hint">⚠️ Se mudar nomes, valor ou data, faça o sorteio de novo e reenvie os links. Os links antigos deixam de valer.</p>
    </div>`:""}
  `;
  bindAdmin();
}

function changed(){ if(state.draw){state.draw=null;} save(); renderAdmin(); }

function bindAdmin(){
  const add=()=>{const v=$("#newName").value.trim();if(!v)return;
    if(state.names.some(n=>n.toLowerCase()===v.toLowerCase())){toast("Esse nome já está na lista");return}
    state.names.push(v);changed();setTimeout(()=>$("#newName").focus(),0)};
  $("#addBtn").onclick=add;
  $("#newName").onkeydown=e=>{if(e.key==="Enter")add()};
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const n=state.names[+b.dataset.del];
    state.names.splice(+b.dataset.del,1);state.rules=state.rules.filter(r=>!r.includes(n));changed()});
  $("#val").onchange=e=>{state.value=e.target.value.trim();changed()};
  $("#dt").onchange=e=>{state.date=e.target.value.trim();changed()};
  $("#pl").onchange=e=>{state.place=e.target.value.trim();changed()};
  $("#ruleBtn").onclick=()=>{const a=$("#ra").value,b=$("#rb").value;
    if(!a||!b||a===b){toast("Escolha duas pessoas diferentes");return}
    if(blocked(a,b)){toast("Essa regra já existe");return}
    state.rules.push([a,b]);changed()};
  document.querySelectorAll("[data-rule]").forEach(b=>b.onclick=()=>{state.rules.splice(+b.dataset.rule,1);changed()});
  $("#noRedo").onclick=()=>{$("#confirmBox").style.display="none"};
  $("#yesRedo").onclick=()=>{$("#confirmBox").style.display="none";runDraw()};
  $("#drawBtn").onclick=()=>{ if(state.draw){$("#confirmBox").style.display="block";return} runDraw(); };
  function runDraw(){
    const err=$("#err");err.style.display="none";
    if(state.names.length<3){err.textContent="Coloque pelo menos 3 participantes.";err.style.display="block";return}
    const d=doDraw();
    if(!d){err.textContent="Com essas restrições não dá para sortear. Remova alguma regra.";err.style.display="block";return}
    state.draw=d;save();renderAdmin();toast("Sorteio feito! 🎉");
  }
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    try{await navigator.clipboard.writeText(b.dataset.copy);toast("Mensagem copiada!")}catch(e){toast("Não foi possível copiar")}
  });
}

// ---------- tela de revelação ----------
function renderReveal(data){
  $("#app").innerHTML=`
    <div class="reveal">
      <h2 class="hello">Olá, ${esc(data.g)}! 👋</h2>
      <p style="color:var(--muted);margin:0">Toque no presente para descobrir seu amigo secreto</p>
      <div class="gift" id="gift" role="button" aria-label="Abrir presente" tabindex="0">
        <div class="box"></div><div class="rib-v"></div><div class="lid"></div><div class="bow">🎀</div>
      </div>
      <div class="result" id="result">
        <p style="margin:0;color:var(--muted)">Você tirou</p>
        <div class="big">${esc(data.r)}</div>
        <div class="info">
          ${data.v?`<span>💰 Valor: <b>${esc(data.v)}</b></span>`:""}
          ${data.d?`<span>📅 Troca: <b>${esc(data.d)}</b></span>`:`<span>📅 Data: <b>em breve</b></span>`}
          ${data.p?`<span>📍 ${esc(data.p)}</span>`:""}
        </div>
        <p class="secret">🤫 Guarde segredo! Esta página é só sua.</p>
        <button class="btn btn-soft btn-sm" id="hideBtn">🙈 Esconder de novo</button>
      </div>
    </div>`;
  const open=()=>{const g=$("#gift");if(g.classList.contains("open"))return;g.classList.add("open");
    setTimeout(()=>{$("#result").classList.add("show");confetti()},450)};
  $("#gift").onclick=open;
  $("#hideBtn").onclick=()=>renderReveal(data);
  $("#gift").onkeydown=e=>{if(e.key==="Enter"||e.key===" ")open()};
}
function confetti(){
  const colors=["#B3122E","#1F6B4A","#E8B04B","#F28AA0","#6FBF95"];
  for(let i=0;i<70;i++){const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"vw";c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2+Math.random()*2)+"s";c.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),4600)}
}

function route(){
  const tok=location.hash.slice(1);
  const data=tok?decode(tok):null;
  if(data&&data.g&&data.r)renderReveal(data);else renderAdmin();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
